description: |
  Package the Magnific remote MCP server as an installable Claude Code plugin so
  content creators get Magnific's upscaling, image/video generation, character
  references, and creation history inside a normal Claude Code session. The
  plugin registers the streamable-HTTP endpoint https://mcp.magnific.com, whose
  authentication is browser OAuth handled by Claude Code — no API key is stored
  in the repository or in the user's environment. On top of the raw MCP tools it
  ships a creator-facing skill that teaches Claude which tool to reach for, and
  slash commands for the workflows creators repeat most: upscaling a delivery
  asset, generating a concept, and reusing past creations.

acceptance_criteria:
  - "Given the repository URL, when the user runs `/plugin marketplace add arananet/magnific_claude_code_plugin` followed by `/plugin install magnific@arananet`, then the plugin installs; the repo carries .claude-plugin/marketplace.json listing a plugin whose name matches plugin.json and whose source resolves to a directory containing .claude-plugin/plugin.json."
  - "Given the plugin is installed, when Claude Code loads it, then a `magnific` MCP server is registered with transport `http` and url `https://mcp.magnific.com`."
  - "Given the plugin is installed, when the user first invokes a Magnific tool, then authentication happens through the browser OAuth flow and no API key or token is read from the repo or environment."
  - "Given the plugin is installed, when the user types a slash command, then /magnific:setup, :upscale, :generate, :creations, :library, :budget, :batch and :brief are available."
  - "Given a Magnific tool returns hosted asset URLs, when the PostToolUse hook runs, then each asset is downloaded under .magnific/assets/ and an entry recording tool, prompt, settings and paths is appended to .magnific/ledger.jsonl."
  - "Given the configured daily paid-call budget has been reached, when another paid Magnific tool is about to run, then the PreToolUse hook returns permissionDecision 'ask' with the count and the budget; read-only tools are never guarded."
  - "Given a Magnific tool name the plugin does not recognize, when the guard classifies it, then it is treated as paid, so a newly added generation tool is guarded rather than spending silently."
  - "Given either hook receives malformed input or hits an error, when it runs, then it exits 0 with valid JSON and the user's tool call is unaffected."
  - "Given a creator asks for a multi-asset set, when work is delegated to the magnific-art-director subagent, then it checks budget and existing work first, anchors the set to one custom reference, and generates one asset at a time."
  - "Given a creator asks for upscaling, generation, or past assets in natural language, when Claude loads the magnific-creator-workflows skill, then it selects the matching Magnific tool and states the credit cost implication before running a paid generation."
  - "Given Magnific renames or adds a tool, when the user runs the plugin, then commands and skill still work because they describe intent and defer exact tool selection to the server's advertised tool list rather than hardcoding a required tool set."
  - "Given a contributor changes plugin files, when `bash tests/plugin.sh` runs, then it fails on invalid JSON, a missing required manifest field, a wrong MCP transport or url, a hook matcher not scoped to magnific tools, a hook that exits non-zero on bad input, or a command/skill/agent file missing YAML frontmatter."

test_plan:
  - "Unit test (tests/plugin.sh): every JSON file under .claude-plugin/ parses and plugin.json carries name, description, version, author."
  - "Unit test (tests/plugin.sh): marketplace.json exists, names the marketplace, lists the plugin under the same name as plugin.json, and its source path contains a plugin manifest — the check that catches an uninstallable repo."
  - "Unit test (tests/plugin.sh): README and the setup command document the two-step marketplace install rather than the `/plugin install <owner>/<repo>` form, which fails with 'Marketplace not found'."
  - "Unit test (tests/plugin.sh): .mcp.json defines the magnific server with type http and url https://mcp.magnific.com."
  - "Unit test (tests/plugin.sh): no API-key-shaped secret or token env var is referenced by the MCP config, guarding the OAuth-only contract."
  - "Unit test (tests/plugin.sh): each file in commands/, skills/ and agents/ opens with a YAML frontmatter block containing a description."
  - "Unit test (tests/plugin.sh): hooks.json wires PreToolUse and PostToolUse with matchers scoped to magnific tools, the manifest points at plugin-hooks/hooks.json, and both hook scripts exit 0 on malformed stdin."
  - "Unit test (tests/magnific_hooks_test.py): paid/free tool classification, including fail-closed handling of an unknown tool."
  - "Unit test (tests/magnific_hooks_test.py): asset-URL extraction finds media links, ignores page links, and deduplicates."
  - "Unit test (tests/magnific_hooks_test.py): guard decisions under, at, and over budget, with calls older than 24h falling out of the window and read-only tools never guarded."
  - "Unit test (tests/magnific_hooks_test.py): capture writes a ledger entry with only known input fields, records the entry even when the download fails, and ignores non-Magnific tools."
  - "Unit test (tests/magnific_hooks_test.py): a corrupt ledger line is skipped rather than fatal."
  - "Integration (manual, qa_notes): install the plugin in a real Claude Code session and confirm the OAuth browser flow and one tool call."

qa_notes: |
  The MCP endpoint could not be reached from the build environment (egress proxy
  returns 403 for magnific.com and mcp.magnific.com), so the tool list used in
  the skill comes from Magnific's public documentation rather than a live
  tools/list handshake. Manual QA must confirm the advertised tool names in a
  real session and correct skills/magnific-creator-workflows/SKILL.md if any
  differ. Paid generations consume Magnific credits — use the smallest
  resolution when smoke-testing.

out_of_scope:
  - "Wrapping the Magnific REST API or handling API keys; the MCP endpoint is OAuth-only."
  - "Reading the user's real Magnific credit balance. The guard rate-limits paid tool calls locally; it cannot see the account."
  - "Proxying, caching, or re-hosting Magnific assets."
  - "Publishing the plugin to a marketplace."

