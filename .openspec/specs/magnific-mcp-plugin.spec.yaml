technical_notes: |
  The repo doubles as its own single-plugin marketplace: `/plugin install` takes
  `plugin@marketplace`, not a repo path, so without .claude-plugin/marketplace.json
  the repo cannot be installed at all.

  Layout: .claude-plugin/plugin.json manifest, .claude-plugin/marketplace.json, .mcp.json for the server,
  commands/*.md, skills/<name>/SKILL.md, agents/*.md, and plugin-hooks/hooks.json.
  Hook config lives in plugin-hooks/ rather than hooks/ because the repo root's
  hooks/ already holds OpenSpec's git hooks; the manifest points at it explicitly.
  Hook scripts are standard-library Python 3 under scripts/magnific/ and write
  state to .magnific/ in the project being worked on (CLAUDE_PROJECT_DIR).
  Registering only the server, without any of this, is
  `claude mcp add --transport http magnific https://mcp.magnific.com`.

