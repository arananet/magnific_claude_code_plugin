technical_notes: |
  Claude Code plugin layout: .claude-plugin/plugin.json manifest, .mcp.json for
  the server, commands/*.md for slash commands, skills/<name>/SKILL.md for the
  skill. Equivalent one-line install without the plugin:
  `claude mcp add --transport http magnific https://mcp.magnific.com`.

